name: bigbank-dragon

services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: dragon
      MYSQL_USER: dragon
      MYSQL_PASSWORD: dragon
      MYSQL_ROOT_PASSWORD: dragon-root-local-only
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The password goes through the environment, not argv, where `ps` would show it.
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      args:
        NPM_REGISTRY: '${NPM_REGISTRY:-https://registry.npmjs.org/}'
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: mysql://dragon:dragon@mysql:3306/dragon
      WEB_DIST_DIR: /app/apps/web/dist
    # Loopback only: the API has no authentication, so it is not offered to the network.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    # A bot turn in flight finishes after SIGTERM: a read with its retries, then one
    # 10s solve or buy. 30s covers the usual case, not every retry exhausted.
    stop_grace_period: 30s
    init: true
    # `exec` makes node, not the shell, receive the stop signal.
    command: sh -c 'node apps/api/src/migrate.ts && exec node apps/api/src/server.ts'
    # The slim image has no curl; node's own fetch does the probe. start_period covers the migration.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  mysql-data:
